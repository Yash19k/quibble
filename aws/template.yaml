AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Quibble - serverless multiplayer quiz. API Gateway (HTTP + WebSocket), Lambda, DynamoDB,
  S3 static website, CloudWatch logs/metrics/alarms/dashboard, email alerts (SNS + a monitor Lambda),
  least-privilege IAM roles.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign login tokens (64+ random characters).
  WebSocketStageName:
    Type: String
    Default: prod
  RevealMs:
    Type: Number
    Default: 4000
    Description: Pause between a question's result and the next question (ms).
  MaxPlayers:
    Type: Number
    Default: 250
    MinValue: 1
    MaxValue: 1000
    Description: Most players one game accepts (load-tested at 250).
  LateGraceMs:
    Type: Number
    Default: 1500
    MinValue: 1
    MaxValue: 10000
    Description: >
      Answers that reached API Gateway up to this long after a question's timer hit zero still count.
      Raise it (e.g. 5000) while the account's Lambda concurrency quota is still low.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  ExtraCorsOrigin:
    Type: String
    Default: 'http://localhost:5050'
    Description: Another origin allowed to call the HTTP API (e.g. the local dev server).
  AlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >
      Where alert emails go (site down, errors, failed deploys, sensitive admin actions). AWS emails this address a
      "Confirm subscription" link first. Empty = alarms still run, but nobody is emailed.
  AlertTimeZone:
    Type: String
    Default: UTC
    Description: Time zone for the times in alert emails (an IANA name such as Asia/Kolkata or Europe/London).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    CodeUri: backend/
    MemorySize: 512 # more memory = more CPU: fan-out to 250 sockets and JSON work finish sooner
    Timeout: 15
    # No reserved concurrency anywhere: it carves slots out of the shared account pool (and is impossible while the
    # account quota is still the 10-slot default).
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        QUESTIONS_TABLE: !Ref QuestionsTable
        GAMES_TABLE: !Ref GamesTable
        GAMEPLAY_TABLE: !Ref GamePlayTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        RESULTS_TABLE: !Ref ResultsTable
        RATE_LIMITS_TABLE: !Ref RateLimitsTable
        QUIZZES_TABLE: !Ref QuizzesTable
        ADMIN_TABLE: !Ref AdminTable
        JWT_SECRET: !Ref JwtSecret
        REVEAL_MS: !Ref RevealMs
        MAX_PLAYERS: !Ref MaxPlayers
        LATE_GRACE_MS: !Ref LateGraceMs
        BROADCAST_WINDOW_MS: '500' # lobby lists are pushed at most once per window per game
        # Sized so a whole classroom behind one Wi-Fi IP can sign up and log in at once.
        REGISTER_MAX_PER_IP: '500' # sign-ups per IP per hour
        LOGIN_FAIL_MAX_PER_IP: '200' # failed logins per IP per 15 min
        LOGIN_FAIL_MAX_PER_EMAIL: '10' # failed logins per account per 15 min
        WS_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStageName}'
        # A plain name (not !Ref) so the timer function can reference itself without a circular dependency.
        TIMER_FUNCTION: !Sub '${AWS::StackName}-game-timer'

Resources:
  # =====================================================================
  # DynamoDB (on-demand billing: you pay per request, nothing when idle)
  # =====================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # One small header item per game, written only when the game changes phase.
  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: code, AttributeType: S }]
      KeySchema: [{ AttributeName: code, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # Everything many players write at once (seats, answers, question gates, scores, results). Each item family has
  # its own partition key (<code>#P, <code>#A#<k>, <code>#Q ...) so no key takes more than one family's burst and
  # every key stays far below DynamoDB's per-partition limits. Items expire a day after the game.
  GamePlayTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # Fan-out reads a game's members (and their connection ids) from GamePlayTable, so there's no byGame index here.
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: userId, AttributeType: S }
      KeySchema: [{ AttributeName: connectionId, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: byUser
          KeySchema: [{ AttributeName: userId, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # Per-player game results, plus the materialised leaderboards (userId '#board').
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Quizzes players build themselves ("My quizzes"). byOwner lists one player's quizzes, newest edit first.
  QuizzesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: ownerId, AttributeType: S }
        - { AttributeName: updatedAt, AttributeType: S }
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: byOwner
          KeySchema:
            - { AttributeName: ownerId, KeyType: HASH }
            - { AttributeName: updatedAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Admin panel: the audit log of admin actions (pk AUDIT, newest last; kept a year) and site settings such as the
  # announcement banner (pk SETTING). Only the api function touches it.
  AdminTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: key, AttributeType: S }]
      KeySchema: [{ AttributeName: key, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  # =====================================================================
  # S3 static website (the frontend in public/). Players use the HTTPS REST endpoint
  # (https://<bucket>.s3.<region>.amazonaws.com/index.html, the WebsiteUrl output): browsers warn on plain HTTP
  # pages. The HTTP website endpoint (WebsiteHttpUrl) keeps working for old links.
  # =====================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false # the bucket policy below makes objects publicly readable
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # =====================================================================
  # API Gateway HTTP API (REST endpoints under /api/*)
  # =====================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${FrontendBucket.RegionalDomainName}' # the HTTPS page players open
          - !GetAtt FrontendBucket.WebsiteURL # the old HTTP website endpoint
          - !Ref ExtraCorsOrigin
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        ExposeHeaders: [retry-after] # the page honours Retry-After when it backs off
        MaxAge: 600
      # Whole-API ceiling (the account allows 10,000 rps shared by every API). 200 sign-ups at once is far below.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2000
        ThrottlingRateLimit: 1000
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","error":"$context.error.message","integrationError":"$context.integrationErrorMessage"}'

  HttpApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/quibble/${AWS::StackName}/http-api-access'
      RetentionInDays: !Ref LogRetentionDays

  # =====================================================================
  # API Gateway WebSocket API (real-time gameplay)
  # =====================================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations'
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE # the Lambda checks the JWT itself
      Target: !Sub 'integrations/${ConnectIntegration}'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations'
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${DisconnectIntegration}'

  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMessageFunction.Arn}/invocations'
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${MessageIntegration}'

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute]
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref WebSocketStageName
      DeploymentId: !Ref WebSocketDeployment
      # 250 players answering within the same 100 ms is a 250-message burst; leave plenty of headroom.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2000
        ThrottlingRateLimit: 1000

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
  WsMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsMessageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # =====================================================================
  # Lambda functions. Each gets its own IAM role with only the permissions it needs
  # (SAM turns the Policies list into a role per function).
  # =====================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: REST API (auth, leaderboard, history, admin)
      Handler: src/handlers/http.handler
      MemorySize: 1769 # one full vCPU: bcrypt is CPU-bound and 200 people may sign up at once
      Timeout: 20 # trivia import calls an external API
      LoggingConfig: { LogGroup: !Ref ApiLogGroup }
      Environment:
        Variables: # sensitive admin actions are emailed (lib/alerts.js)
          ALERTS_TOPIC: !Ref AlertsTopic
          ALERT_TIME_ZONE: !Ref AlertTimeZone
          STACK_NAME: !Ref AWS::StackName
          SITE_URL: !Sub 'https://${FrontendBucket.RegionalDomainName}'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref QuestionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable } # admin ban kicks players from live games
        - DynamoDBCrudPolicy: { TableName: !Ref GamePlayTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } # leaderboards are materialised on read and after bans
        - DynamoDBCrudPolicy: { TableName: !Ref RateLimitsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref QuizzesTable } # My quizzes
        - DynamoDBCrudPolicy: { TableName: !Ref AdminTable } # audit log + announcement
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName } # admin-activity alerts
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketStageName}/*/@connections/*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-game-timer'

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: WebSocket $connect - authenticate and register the socket
      Handler: src/handlers/wsConnect.handler
      LoggingConfig: { LogGroup: !Ref WsLogGroup }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: WebSocket $disconnect - mark the player offline
      Handler: src/handlers/wsDisconnect.handler
      LoggingConfig: { LogGroup: !Ref WsLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBReadPolicy: { TableName: !Ref QuestionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamePlayTable } # a departure can close a question early
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResultsTable }
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketStageName}/*/@connections/*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-game-timer'

  WsMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: WebSocket $default - game actions (create, join, start, answer...)
      Handler: src/handlers/wsMessage.handler
      LoggingConfig: { LogGroup: !Ref WsLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable } # creating a game is one transaction with the user item
        - DynamoDBReadPolicy: { TableName: !Ref QuestionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref QuizzesTable } # hosting one of My quizzes
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamePlayTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResultsTable }
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketStageName}/*/@connections/*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-game-timer'

  GameTimerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-game-timer'
      Description: Waits for a question/reveal deadline, then advances the game
      Handler: src/handlers/gameTimer.handler
      MemorySize: 512 # pushes each question and result to every player
      Timeout: 120
      # Each timer schedules the next one (question -> reveal -> question ...). Without this, Lambda's recursive-loop
      # detection stops the chain after ~16 hops, i.e. in the middle of a game.
      RecursiveLoop: Allow
      LoggingConfig: { LogGroup: !Ref TimerLogGroup }
      EventInvokeConfig:
        MaximumRetryAttempts: 2 # every step is idempotent, so a retry is safe
        MaximumEventAgeInSeconds: 600 # throttled events wait in Lambda's queue (with backoff) this long
      Events:
        # Closes games everyone walked away from (and expired or frozen ones), so nothing stays "live" overnight.
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
            Input: '{"kind":"sweep"}'
            Description: Quibble sweep of abandoned, expired and frozen games
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBReadPolicy: { TableName: !Ref QuestionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamePlayTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } # final results + leaderboards
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketStageName}/*/@connections/*'
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-game-timer'

  # =====================================================================
  # CloudWatch: log groups with retention, alarms, dashboard
  # =====================================================================
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/quibble/${AWS::StackName}/api'
      RetentionInDays: !Ref LogRetentionDays
  WsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/quibble/${AWS::StackName}/websocket'
      RetentionInDays: !Ref LogRetentionDays
  TimerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/quibble/${AWS::StackName}/game-timer'
      RetentionInDays: !Ref LogRetentionDays

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-lambda-errors'
      AlarmDescription: The REST API Lambda threw errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  WsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-websocket-lambda-errors'
      AlarmDescription: A WebSocket Lambda (connect, disconnect or game messages) threw errors
      Metrics:
        - Id: total
          Expression: FILL(msg, 0) + FILL(conn, 0) + FILL(disc, 0) # a function with no traffic has no data points
          Label: WebSocket Lambda errors
        - Id: msg
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref WsMessageFunction }] }
            Period: 300
            Stat: Sum
        - Id: conn
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref WsConnectFunction }] }
            Period: 300
            Stat: Sum
        - Id: disc
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref WsDisconnectFunction }] }
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  TimerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-game-timer-errors'
      AlarmDescription: The game timer failed to advance a game
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref GameTimerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-http-api-5xx'
      AlarmDescription: The HTTP API returned 5 or more server errors in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  # Account-wide (no dimensions): every function in this account and region shares one concurrency pool, so a
  # throttle anywhere means players are waiting. See "Capacity & scaling" in the README.
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-throttles'
      AlarmDescription: Lambda throttled invocations in this account and region (concurrency quota reached)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  TimerEventsDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-game-timer-events-dropped'
      AlarmDescription: Lambda dropped game-timer events (too old or out of retries); players recover via sync
      Namespace: AWS/Lambda
      MetricName: AsyncEventsDropped
      Dimensions: [{ Name: FunctionName, Value: !Ref GameTimerFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  TimerEventAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-game-timer-late'
      AlarmDescription: Game-timer events waited 5 s or more in Lambda's queue (throttling or retries), so phases ran late
      Namespace: AWS/Lambda
      MetricName: AsyncEventAge
      Dimensions: [{ Name: FunctionName, Value: !Ref GameTimerFunction }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5000 # milliseconds
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  GamePlayWriteThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gameplay-table-write-throttles'
      AlarmDescription: DynamoDB throttled writes to the GamePlay table (a hot partition key)
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref GamePlayTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  GamePlayReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gameplay-table-read-throttles'
      AlarmDescription: DynamoDB throttled reads from the GamePlay table (a hot partition key)
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref GamePlayTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  GamesWriteThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-games-table-write-throttles'
      AlarmDescription: DynamoDB throttled writes to the Games table (a hot game header)
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref GamesTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  GamesReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-games-table-read-throttles'
      AlarmDescription: DynamoDB throttled reads from the Games table (a hot game header)
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions: [{ Name: TableName, Value: !Ref GamesTable }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn] # emails you (handlers/monitor.js)

  # =====================================================================
  # Email alerts. Every alarm above invokes the monitor function, which emails the alerts topic a readable message
  # with the matching error log lines. The monitor also probes the live site every minute and reports failed deploys.
  # Set the address once with: npm run deploy -- AlertEmail=you@example.com (then click the link AWS emails you).
  # =====================================================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Quibble alerts # the sender name in the inbox

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  MonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/quibble/${AWS::StackName}/monitor'
      RetentionInDays: !Ref LogRetentionDays

  MonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-monitor'
      Description: Uptime probes every minute; emails alarms, failed deploys and outages to the alerts topic
      Handler: src/handlers/monitor.handler
      MemorySize: 256
      Timeout: 60 # probes time out after 8 s and retry once
      LoggingConfig: { LogGroup: !Ref MonitorLogGroup }
      Environment:
        Variables:
          ALERTS_TOPIC: !Ref AlertsTopic
          ALERT_TIME_ZONE: !Ref AlertTimeZone
          STACK_NAME: !Ref AWS::StackName
          SITE_URL: !Sub 'https://${FrontendBucket.RegionalDomainName}'
          HTTP_API_URL: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
          WS_URL: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStageName}'
          LOG_GROUP_API: !Ref ApiLogGroup
          LOG_GROUP_WEBSOCKET: !Ref WsLogGroup
          LOG_GROUP_TIMER: !Ref TimerLogGroup
          LOG_GROUP_ACCESS: !Ref HttpApiAccessLogs
          LOG_GROUP_MONITOR: !Ref MonitorLogGroup
      Events:
        HealthCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Quibble uptime probes (website, /api/health, WebSocket)
        DeployFailed:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.cloudformation]
              detail-type: [CloudFormation Stack Status Change]
              detail:
                stack-id: [!Ref AWS::StackId]
                status-details:
                  status: [UPDATE_ROLLBACK_COMPLETE, UPDATE_ROLLBACK_FAILED, UPDATE_FAILED, ROLLBACK_COMPLETE, ROLLBACK_FAILED, DELETE_FAILED]
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: sns:ListSubscriptionsByTopic # npm run alerts:test shows whether the address confirmed
              Resource: !Ref AlertsTopic
            - Effect: Allow
              Action: logs:FilterLogEvents # the error lines quoted in alarm emails
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/quibble/${AWS::StackName}/*'
            - Effect: Allow
              Action: cloudformation:DescribeStackEvents # which resource made a deploy fail
              Resource: !Ref AWS::StackId

  # CloudWatch alarms named <stack>-* may invoke the monitor.
  MonitorAlarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt MonitorFunction.Arn
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'

  # The monitor writes HealthCheckFailed (0 or 1) every minute. Two failed minutes out of three = down; an email when
  # it breaks and another when it recovers. Missing data (no probe ran) is not an outage: MonitorErrorsAlarm covers that.
  HealthCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-health-check'
      AlarmDescription: The website, the HTTP API + database or the WebSocket API stopped answering
      Namespace: Quibble
      MetricName: HealthCheckFailed
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn]
      OKActions: [!GetAtt MonitorFunction.Arn] # "back up" email

  # Lambda's Errors metric only counts crashes. The API and WebSocket handlers catch errors, log them
  # (lib/log.js, level "error") and answer 500 / "server busy", so count those log lines too.
  ApiErrorLogsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations: [{ MetricNamespace: Quibble, MetricName: ErrorLogLines, MetricValue: '1', Unit: Count }]
  WsErrorLogsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WsLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations: [{ MetricNamespace: Quibble, MetricName: ErrorLogLines, MetricValue: '1', Unit: Count }]
  TimerErrorLogsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TimerLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations: [{ MetricNamespace: Quibble, MetricName: ErrorLogLines, MetricValue: '1', Unit: Count }]

  ErrorLogsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-error-logs'
      AlarmDescription: The backend logged errors (failed requests, game actions or timer steps)
      Namespace: Quibble
      MetricName: ErrorLogLines
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!GetAtt MonitorFunction.Arn]

  # The fallback: if the monitor itself fails (it can't probe or can't send), SNS emails CloudWatch's plain message.
  MonitorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-monitor-errors'
      AlarmDescription: !Sub 'The Quibble monitor failed, so other alerts may not reach you. See the log group /quibble/${AWS::StackName}/monitor.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref MonitorFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}'
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
                "title": "Games", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "Quibble", "GamesCreated" ], [ ".", "GamesStarted" ], [ ".", "GamesFinished" ], [ ".", "GamesCancelled" ]
                ] } },
            { "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
                "title": "Gameplay", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "Quibble", "AnswersSubmitted" ], [ ".", "QuestionsAsked" ], [ ".", "UsersRegistered" ], [ ".", "GameWriteConflicts" ]
                ] } },
            { "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
                "title": "Lambda concurrency (max per minute)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "ConcurrentExecutions", { "label": "Whole account" } ],
                  [ "AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${WsMessageFunction}" ],
                  [ "...", "${GameTimerFunction}" ],
                  [ "...", "${ApiFunction}" ],
                  [ "...", "${WsConnectFunction}" ],
                  [ "...", "${WsDisconnectFunction}" ]
                ] } },
            { "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
                "title": "Lambda throttles (should stay at 0)", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Throttles", { "label": "Whole account" } ],
                  [ "AWS/Lambda", "Throttles", "FunctionName", "${WsMessageFunction}" ],
                  [ "...", "${GameTimerFunction}" ],
                  [ "...", "${ApiFunction}" ],
                  [ "...", "${WsConnectFunction}" ],
                  [ "AWS/Lambda", "AsyncEventsDropped", "FunctionName", "${GameTimerFunction}", { "label": "Timer events dropped" } ]
                ] } },
            { "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
                "title": "DynamoDB throttles (should stay at 0)", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  [ "AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${GamePlayTable}", { "label": "GamePlay writes" } ],
                  [ ".", "ReadThrottleEvents", ".", ".", { "label": "GamePlay reads" } ],
                  [ ".", "WriteThrottleEvents", ".", "${GamesTable}", { "label": "Games writes" } ],
                  [ ".", "ReadThrottleEvents", ".", ".", { "label": "Games reads" } ],
                  [ ".", "WriteThrottleEvents", ".", "${UsersTable}", { "label": "Users writes" } ]
                ] } },
            { "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
                "title": "GamePlay table capacity used (units per minute)", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${GamePlayTable}" ],
                  [ ".", "ConsumedReadCapacityUnits", ".", "." ]
                ] } },
            { "type": "metric", "x": 0, "y": 18, "width": 12, "height": 6, "properties": {
                "title": "WebSocket API", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/ApiGateway", "ConnectCount", "ApiId", "${WebSocketApi}", "Stage", "${WebSocketStageName}" ],
                  [ ".", "MessageCount", ".", ".", ".", "." ],
                  [ ".", "ClientError", ".", ".", ".", "." ],
                  [ ".", "ExecutionError", ".", ".", ".", "." ]
                ] } },
            { "type": "metric", "x": 12, "y": 18, "width": 12, "height": 6, "properties": {
                "title": "HTTP API", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", "Stage", "$default", { "stat": "Sum" } ],
                  [ ".", "4xx", ".", ".", ".", ".", { "stat": "Sum" } ],
                  [ ".", "5xx", ".", ".", ".", ".", { "stat": "Sum" } ],
                  [ ".", "Latency", ".", ".", ".", ".", { "stat": "p90", "yAxis": "right" } ]
                ] } },
            { "type": "metric", "x": 0, "y": 24, "width": 12, "height": 6, "properties": {
                "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}" ],
                  [ "...", "${WsMessageFunction}" ],
                  [ "...", "${WsConnectFunction}" ],
                  [ "...", "${WsDisconnectFunction}" ],
                  [ "...", "${GameTimerFunction}" ]
                ] } },
            { "type": "metric", "x": 12, "y": 24, "width": 12, "height": 6, "properties": {
                "title": "Lambda duration p90 (ms)", "region": "${AWS::Region}", "stat": "p90", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}" ],
                  [ "...", "${WsMessageFunction}" ]
                ] } },
            { "type": "log", "x": 0, "y": 30, "width": 24, "height": 6, "properties": {
                "title": "Recent errors", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${ApiLogGroup}' | SOURCE '${WsLogGroup}' | SOURCE '${TimerLogGroup}' | fields @timestamp, msg, error.message | filter level = 'error' | sort @timestamp desc | limit 20"
              } },
            { "type": "metric", "x": 0, "y": 36, "width": 24, "height": 6, "properties": {
                "title": "Uptime probes and logged errors (should stay at 0)", "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                "metrics": [
                  [ "Quibble", "HealthCheckFailed", { "stat": "Maximum", "label": "Health check failed (1 = down)" } ],
                  [ ".", "ErrorLogLines", { "stat": "Sum", "label": "Error log lines" } ]
                ] } }
          ]
        }

Outputs:
  WebsiteUrl:
    Description: Share this link with players (HTTPS)
    Value: !Sub 'https://${FrontendBucket.RegionalDomainName}/index.html'
  WebsiteHttpUrl:
    Description: The same site over plain HTTP (S3 website endpoint; browsers warn about it)
    Value: !GetAtt FrontendBucket.WebsiteURL
  HttpApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  WebSocketUrl:
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${WebSocketStageName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  UsersTableName:
    Value: !Ref UsersTable
  QuestionsTableName:
    Value: !Ref QuestionsTable
  GamesTableName:
    Value: !Ref GamesTable
  GamePlayTableName:
    Value: !Ref GamePlayTable
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}'
  AlertsTopicArn:
    Description: SNS topic the alert emails go through (subscribe more addresses to it in the SNS console)
    Value: !Ref AlertsTopic
  MonitorFunctionName:
    Description: Uptime probes + alert emails (npm run alerts:test sends a test email through it)
    Value: !Ref MonitorFunction
